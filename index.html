<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<title>GameMarket - Sklep z grami</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>

<body>
<header>
  <div class="logo">GameMarket</div>
  <nav>
    <input type="text" id="search" placeholder="Szukaj gry...">
    <a href="login.html"><i class="fa fa-user"></i></a>
    <a href="cart.html"><i class="fa fa-shopping-cart"></i><span id="cart-count">0</span></a>
  </nav>
</header>

<section class="filter-bar">
  <select id="filter-platform">
    <option value="all">Platforma: Wszystkie</option>
    <option value="steam">Steam</option>
    <option value="epic">Epic Games</option>
  </select>

  <select id="filter-price">
    <option value="all">Cena: Wszystkie</option>
    <option value="low">0 - 50 zł</option>
    <option value="mid">50 - 150 zł</option>
    <option value="high">150+ zł</option>
  </select>
</section>

<section class="products" id="product-list"></section>

<script src="js/data.js"></script>
<script src="js/main.js"></script>
</body>
</html>
