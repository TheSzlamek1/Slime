<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<title>K4G Style Store</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
*{box-sizing:border-box}
body{
margin:0;
font-family:Inter,Segoe UI,Arial;
background:radial-gradient(circle at top,#1b1f4a 0%,#070815 60%);
color:#fff}

/* TOP BAR */
.topbar{
background:#b82025;
padding:6px;
text-align:center;
font-size:13px;
font-weight:800}

/* HEADER */
header{
display:grid;
grid-template-columns:auto auto 1fr auto;
gap:18px;
align-items:center;
padding:20px 40px}
.logo{
font-size:34px;
font-weight:900}
.actions span{
background:#1e214b;
padding:8px 14px;
border-radius:999px;
margin-right:8px;
font-size:13px}
.search{
position:relative}
.search input{
width:420px;
padding:14px 16px 14px 44px;
border-radius:14px;
border:none;
background:#1e214b;
color:#fff}
.search i{
position:absolute;
left:16px;
top:50%;
transform:translateY(-50%)}
.header-right{
display:flex;
gap:12px;
align-items:center}
.select{
background:#1e214b;
border:none;
color:#fff;
padding:8px 12px;
border-radius:999px}
.cart-btn{
position:relative;
background:#ff3b3b;
padding:10px 14px;
border-radius:12px;
cursor:pointer}

/* MAIN */
.main{
padding:40px}
.title{
font-size:30px;
font-weight:900}
.subtitle{
opacity:.7;
margin-bottom:30px}

/* GRID */
.grid{
display:grid;
grid-template-columns:repeat(4,1fr) 1.3fr;
gap:24px}

/* CARD */
.card{
background:#15183a;
border-radius:16px;
overflow:hidden;
position:relative}
.card img{
width:100%;
height:220px;
object-fit:cover}
.badge{
position:absolute;
top:12px;
left:12px;
background:#ff3b3b;
padding:4px 10px;
border-radius:999px;
font-size:11px;
font-weight:800}
.card h4{
padding:14px;
font-size:14px;
min-height:44px}
.icons{
display:flex;
gap:8px;
padding:0 14px;
opacity:.7}
.price{
padding:14px;
display:flex;
align-items:center;
gap:10px}
.old{
text-decoration:line-through;
opacity:.5}
.new{
font-weight:900}
.discount{
background:#2ecc71;
padding:4px 8px;
border-radius:999px;
font-size:12px}
.buy{
margin:0 14px 16px;
background:#2c6cff;
border:none;
color:#fff;
padding:12px;
border-radius:10px;
width:calc(100% - 28px);
cursor:pointer}

/* PROMO */
.promo{
background:url("https://i.imgur.com/Y3xZQZJ.jpg") center/cover;
border-radius:18px;
padding:30px;
display:flex;
flex-direction:column;
justify-content:space-between}

/* CART */
.cart{
position:fixed;
top:0;
right:-380px;
width:380px;
height:100%;
background:#0d0f25;
padding:20px;
transition:.35s;
z-index:10}
.cart.active{right:0}
.overlay{
position:fixed;
inset:0;
background:rgba(0,0,0,.6);
opacity:0;
visibility:hidden;
transition:.3s}
.overlay.active{opacity:1;visibility:visible}
</style>
</head>

<body>

<div class="topbar">🚀 Extra -10% off ANY Game Pass!</div>

<header>
<div class="logo">K4G</div>

<div class="actions">
<span>Buy, Play, Help!</span>
<span>Zarabiaj z K4G</span>
</div>

<div class="search">
<i class="fa fa-search"></i>
<input placeholder="Szukaj">
</div>

<div class="header-right">
<select class="select">
<option>PLN</option>
<option>EUR</option>
<option>USD</option>
</select>
<div class="cart-btn" onclick="toggleCart()">
<i class="fa fa-shopping-cart"></i>
</div>
</div>
</header>

<section class="main">
<div class="title">Bestsellery</div>
<div class="subtitle">Najchętniej kupowane tytuły</div>

<div class="grid">

<!-- CARD -->
<div class="card">
<span class="badge">HOT DEAL</span>
<img src="https://cdn.kinguin.com/media/catalog/product/cache/926507dc7f93631a094422215b778fe0/m/i/minecraft-java-bedrock.jpeg">
<h4>Minecraft Java & Bedrock Edition</h4>
<div class="icons">
<i class="fa fa-key"></i>
<i class="fa fa-bolt"></i>
</div>
<div class="price">
<span class="old">PLN 148.88</span>
<span class="new">PLN 50.21</span>
<span class="discount">-66%</span>
</div>
<button class="buy">Kup teraz</button>
</div>

<!-- PROMO -->
<div class="promo">
<h2>PAWSOME DEAL</h2>
<h3>Get extra -10% with code: FEAR</h3>
</div>

</div>
</section>

<div class="cart" id="cart">
<h3>Koszyk</h3>
</div>
<div class="overlay" id="overlay" onclick="toggleCart()"></div>

<script>
function toggleCart(){
cart.classList.toggle("active");
overlay.classList.toggle("active");
}
</script>

</body>
</html>
