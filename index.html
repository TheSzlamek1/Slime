<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<title>GameMarket</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<style>

/* Global */
body {
  margin: 0;
  background: #0b0b0e;
  font-family: Arial, sans-serif;
  color: white;
}

/* Top info bar */
.top-info {
  background: #c81515;
  text-align: center;
  padding: 6px;
  font-size: 14px;
  font-weight: 600;
}

/* Header UI */
.main-header {
  display: grid;
  grid-template-columns: 200px 400px 1fr 300px;
  padding: 15px 30px;
  background: #0f0f13;
  align-items: center;
  gap: 20px;
}

.logo {
  font-size: 32px;
  font-weight: 900;
  color: #fff;
}

.logo-dot {
  color: #8d4bff;
}

/* Buttons in header */
.btn {
  padding: 8px 14px;
  border-radius: 6px;
  border: none;
  cursor: pointer;
  font-size: 12px;
  font-weight: 700;
}

.btn-blue { background:#2935ff; color:#fff; }
.btn-purple { background:#8d4bff; color:#fff; }
.btn-green { background:#00b44c; color:#fff; }

/* Search box */
.search-box {
  position: relative;
}

.search-box input {
  width: 100%;
  padding: 10px 40px 10px 15px;
  border-radius: 8px;
  border: none;
  background: #1a1a20;
  color: #fff;
  font-size: 14px;
}

.search-box i {
  position:absolute;
  right:10px;
  top:50%;
  transform:translateY(-50%);
  color:#777;
}

/* Header right side */
.header-right {
  display:flex;
  align-items:center;
  gap:15px;
}

.currency { 
  cursor:pointer;
  font-size: 14px;
  font-weight: 700;
}

.cart-btn {
  position:relative;
  font-size:20px;
  color:white;
}

#cart-count {
  background:#ff4747;
  padding:2px 6px;
  border-radius:50%;
  font-size:11px;
  position:absolute;
  top:-6px;
  right:-6px;
}

.login-btn, .register-btn {
  text-decoration:none;
  padding:7px 12px;
  border-radius:8px;
  font-size:13px;
  border:1px solid #3e3e52;
  color:white;
}

/* Navigation Categories */
.category-nav {
  background:#14141a;
  display:flex;
  gap:25px;
  padding:12px 35px;
}

.category-nav a, .dropdown {
  color:white;
  cursor:pointer;
  font-size:15px;
  font-weight:600;
  text-decoration: none;
}

.sale-badge {
  color:#ff4b4b;
}

</style>
</head>

<body>

<div class="top-info">
  🏆 Świąteczna Promocja — Najlepsze gry w super cenach! 🎮
</div>

<header class="main-header">
  <div class="logo">GameMarket<span class="logo-dot">.PL</span></div>

  <div class="header-buttons">
    <button class="btn btn-blue"><i class="fa fa-gift"></i> Promocje</button>
    <button class="btn btn-purple"><i class="fa fa-coins"></i> Zarabiaj</button>
    <button class="btn btn-green"><i class="fa fa-tags"></i> Tanie Gry</button>
  </div>

  <div class="search-box">
    <input type="text" id="search" placeholder="Szukaj gry...">
    <i class="fa fa-search"></i>
  </div>

  <div class="header-right">
    <span class="currency">PLN <i class="fa fa-angle-down"></i></span>
    <a class="cart-btn" href="#"><i class="fa fa-shopping-cart"></i><span id="cart-count">0</span></a>
    <a class="login-btn" href="#">Zaloguj się</a>
    <a class="register-btn" href="#">Zarejestruj</a>
  </div>
</header>

<nav class="category-nav">
  <a href="#">Bestsellery</a>
  <a href="#">Gry</a>
  <a href="#">Software</a>
  <a href="#">Karty Pre-Paid</a>
  <a class="sale-badge" href="#"><i class="fa fa-bolt"></i> Tanie Konta</a>
  <a href="#"><i class="fa fa-steam"></i> Steam Gift Cards</a>
  <a href="#"><i class="fa fa-xbox"></i> Game Pass</a>
  <a href="#"><i class="fa fa-trophy"></i> Awards</a>
</nav>

</body>
</html>
