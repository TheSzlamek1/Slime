<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<title>GameMarket - Tanie Gry</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>

/* GLOBAL */
body {
    margin: 0;
    background: #1A1A1D;
    font-family: 'Arial', sans-serif;
    color: white;
}

a { text-decoration: none; color: inherit; }

/* HEADER */
.header {
    display: flex;
    align-items: center;
    background: #2A2A2D;
    padding: 15px 25px;
    gap: 30px;
}

.logo {
    font-size: 32px;
    font-weight: 900;
    display: flex;
    align-items: center;
}

.logo span { color: #f0a500; }

/* SEARCH */
.search {
    flex: 1;
    position: relative;
}
.search input {
    width: 100%;
    padding: 10px 45px 10px 15px;
    border-radius: 8px;
    border: none;
    background: #3A3A3E;
    color: white;
    font-size: 16px;
}
.search i {
    position: absolute;
    right: 12px;
    top: 50%;
    font-size: 18px;
    transform: translateY(-50%);
    color: #aaa;
}

/* HEADER RIGHT */
.header-right {
    display: flex;
    align-items: center;
    gap: 20px;
}

.icon-btn {
    font-size: 20px;
    cursor: pointer;
    position: relative;
}

#cartCount {
    position: absolute;
    top: -8px;
    right: -10px;
    background: #ff4747;
    padding: 2px 7px;
    border-radius: 50%;
    font-size: 11px;
    font-weight: bold;
}

/* NAV */
nav {
    background: #222225;
    padding: 12px 25px;
    display: flex;
    gap: 25px;
    border-top: 2px solid #333;
}
nav a {
    font-size: 15px;
    font-weight: 700;
    color: #ddd;
}

/* PRODUCT GRID */
.products {
    padding: 30px;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
    gap: 25px;
}

/* CARD */
.card {
    background: #2C2C30;
    border-radius: 12px;
    overflow: hidden;
    transition: 0.2s;
    cursor: pointer;
}
.card:hover {
    transform: scale(1.03);
}

.card img {
    width: 100%;
    height: 230px;
    object-fit: cover;
}

.card-body {
    padding: 10px;
}

.card-title {
    font-size: 15px;
    font-weight: 600;
    min-height: 45px;
}

.icons {
    margin-top: 8px;
    font-size: 17px;
    display: flex;
    gap: 8px;
}

.price-box {
    background: #f0a500;
    padding: 10px;
    font-size: 16px;
    font-weight: 900;
    text-align: center;
    color: black;
}

/* Add to cart button */
.addCart {
    display: block;
    width: 100%;
    background: #ff8c00;
    text-align: center;
    padding: 8px 0;
    font-weight: bold;
    border: none;
    font-size: 14px;
    cursor: pointer;
}
.addCart:hover {
    background: #ffaa30;
}

.badge {
    position: absolute;
    top: 10px;
    left: 10px;
    background: #ff3c3c;
    padding: 3px 6px;
    font-size: 12px;
    border-radius: 6px;
    font-weight: bold;
}

.card-img-wrap {
    position: relative;
}

</style>
</head>
<body>

<header class="header">
    <div class="logo">Game<span>Market</span></div>

    <div class="search">
        <input type="text" placeholder="Szukaj gry...">
        <i class="fa fa-search"></i>
    </div>

    <div class="header-right">
        <span class="icon-btn">
            <i class="fa fa-shopping-cart"></i>
            <span id="cartCount">0</span>
        </span>
        <span class="icon-btn"><i class="fa fa-user"></i></span>
    </div>
</header>

<nav>
    <a href="#">Produkty</a>
    <a href="#">Gorące Promocje</a>
    <a href="#">Steam</a>
    <a href="#">Origin</a>
    <a href="#">Konsolowe</a>
</nav>

<section class="products" id="products"></section>

<script>
let cart = 0;

// PODSTAWOWE OFERTY
const products = [
    {title: "Call of Duty: MW2", price: "149.99 zł", img: "https://cdn.cloudflare.steamstatic.com/steam/apps/1938090/header.jpg"},
    {title: "Minecraft Java Edition", price: "49.99 zł", img: "https://cdn.cloudflare.steamstatic.com/steam/apps/823500/header.jpg"},
    {title: "Apex Legends", price: "29.75 zł", img: "https://cdn.cloudflare.steamstatic.com/steam/apps/1172470/header.jpg"},
    {title: "EA FC 24", price: "199.00 zł", img: "https://cdn.cloudflare.steamstatic.com/steam/apps/2195250/header.jpg"},
    {title: "CS:GO Prime Status", price: "35.99 zł", img: "https://cdn.cloudflare.steamstatic.com/steam/apps/730/header.jpg"},
    {title: "Battlefield V", price: "22.99 zł", img: "https://cdn.cloudflare.steamstatic.com/steam/apps/1238810/header.jpg"}
];

// GENEROWANIE KART
const productsContainer = document.getElementById("products");

products.forEach((p, index) => {
    productsContainer.innerHTML += `
    <div class="card">
        <div class="card-img-wrap">
            <span class="badge">-${10+index*5}%</span>
            <img src="${p.img}">
        </div>
        <div class="card-body">
            <div class="card-title">${p.title}</div>
            <div class="icons">
                <i class="fa fa-key"></i>
                <i class="fa fa-earth-europe"></i>
            </div>
        </div>
        <div class="price-box">${p.price}</div>
        <button class="addCart" onclick="addToCart()">Dodaj do koszyka</button>
    </div>
    `;
});

// FUNKCJA KOSZYKA
function addToCart() {
    cart++;
    document.getElementById("cartCount").textContent = cart;
    console.log("Dodano do koszyka");
}
</script>

</body>
</html>
