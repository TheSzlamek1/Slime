<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>NAZWA – Premium Game Store</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<style>
/* =========================================================
   RESET + BASE
========================================================= */
* { box-sizing: border-box; }

html, body {
    margin: 0;
    padding: 0;
    font-family: "Segoe UI", Arial, sans-serif;
    background: radial-gradient(circle at top, #171933 0%, #0b0d1a 60%);
    color: #e6e6eb;
}

/* =========================================================
   TOP PROMO BAR
========================================================= */
.top-promo {
    background: linear-gradient(90deg,#c81515,#ff3b3b);
    padding: 6px;
    font-size: 13px;
    font-weight: 700;
    text-align: center;
}

/* =========================================================
   HEADER
========================================================= */
.k4g-header {
    display: grid;
    grid-template-columns: auto 1fr auto;
    align-items: center;
    padding: 18px 40px;
    background: linear-gradient(180deg,#13152e,#0e1022);
    border-bottom: 1px solid #1f2140;
}

/* LEFT */
.header-left {
    display: flex;
    align-items: center;
    gap: 12px;
}

.logo {
    font-size: 34px;
    font-weight: 900;
    letter-spacing: 1px;
}

.pill {
    background: #1b1d3a;
    padding: 8px 14px;
    border-radius: 999px;
    font-size: 13px;
    display: flex;
    gap: 6px;
    align-items: center;
    cursor: pointer;
    transition: .25s;
}
.pill:hover { background:#ff3b3b; }

/* CENTER SEARCH */
.header-center {
    position: relative;
    max-width: 520px;
    width: 100%;
    margin: 0 auto;
}

.header-center input {
    width: 100%;
    padding: 12px 16px 12px 42px;
    border-radius: 12px;
    border: none;
    background: #1b1d3a;
    color: #fff;
    font-size: 14px;
}

.header-center i {
    position: absolute;
    top: 50%;
    left: 14px;
    transform: translateY(-50%);
    opacity: .7;
}

/* RIGHT */
.header-right {
    display: flex;
    align-items: center;
    gap: 12px;
}

.lang-btn {
    background: #1b1d3a;
    padding: 8px 14px;
    border-radius: 999px;
    cursor: pointer;
    font-size: 14px;
}

.cart-btn {
    position: relative;
    background: #1b1d3a;
    padding: 8px 14px;
    border-radius: 999px;
    cursor: pointer;
}

#cartCount {
    position: absolute;
    top: -6px;
    right: -6px;
    background: #37c807;
    font-size: 11px;
    padding: 2px 6px;
    border-radius: 50%;
}

.btn-login {
    background: #3cba06;
    border: none;
    padding: 9px 16px;
    border-radius: 8px;
    font-weight: bold;
    cursor: pointer;
}

.btn-register {
    background: #1b1d3a;
    border: none;
    padding: 9px 16px;
    border-radius: 8px;
    color: #fff;
    cursor: pointer;
}

/* =========================================================
   NAV BAR
========================================================= */
nav {
    display: flex;
    gap: 28px;
    padding: 15px 40px;
    background: #14162f;
    border-bottom: 1px solid #1f2140;
}

nav a {
    color: #bfc2ff;
    text-decoration: none;
    font-weight: 600;
    position: relative;
}
nav a::after {
    content:"";
    position:absolute;
    bottom:-6px;
    left:0;
    width:0;
    height:2px;
    background:#ff3b3b;
    transition:.25s;
}
nav a:hover::after { width:100%; }

/* =========================================================
   PRODUCTS
========================================================= */
.products {
    padding: 40px;
    display: grid;
    grid-template-columns: repeat(auto-fill,minmax(260px,1fr));
    gap: 30px;
}

.product {
    background: linear-gradient(180deg,#1a1c3b,#14162f);
    border-radius: 16px;
    overflow: hidden;
    border: 1px solid #262965;
    transition:.3s;
    position:relative;
}
.product:hover {
    transform: translateY(-6px);
    border-color:#ff3b3b;
}

.product img {
    width:100%;
    height:150px;
    object-fit:cover;
}

.badge {
    position:absolute;
    top:12px;
    left:12px;
    background:#ff3b3b;
    padding:6px 12px;
    border-radius:999px;
    font-size:12px;
    font-weight:bold;
}

.product h4 {
    padding:14px;
    font-size:15px;
    min-height:42px;
}

.price {
    margin: 10px 14px;
    background: linear-gradient(90deg,#ff3b3b,#ff6b6b);
    text-align:center;
    padding:9px;
    border-radius:10px;
    font-weight:bold;
}

.add {
    margin: 0 14px 16px;
    width: calc(100% - 28px);
    background: linear-gradient(90deg,#00d162,#00ff87);
    border:none;
    padding:12px;
    border-radius:10px;
    font-weight:bold;
    cursor:pointer;
}

/* =========================================================
   CART
========================================================= */
.cart {
    position: fixed;
    top:0;
    right:-380px;
    width:380px;
    height:100vh;
    background: linear-gradient(180deg,#16183a,#101226);
    padding:20px;
    transition:.35s;
    z-index:1000;
    display:flex;
    flex-direction:column;
}
.cart.active { right:0; }

.cart h3 { margin-bottom:10px; }

.cart-items {
    flex:1;
    overflow-y:auto;
}

.cart-item {
    display:flex;
    gap:10px;
    background:#1e214d;
    padding:8px;
    border-radius:8px;
    margin-bottom:10px;
}

.cart-item img {
    width:52px;
    height:52px;
    border-radius:6px;
}

.qty {
    display:flex;
    gap:6px;
    margin-top:4px;
}

.qty button {
    background:#ff3b3b;
    border:none;
    color:#fff;
    width:22px;
    height:22px;
    border-radius:4px;
}

.cart-total {
    background:#0b0d1a;
    padding:14px;
    text-align:center;
    border-radius:10px;
    font-weight:bold;
}

.overlay {
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.6);
    opacity:0;
    visibility:hidden;
    transition:.3s;
    z-index:999;
}
.overlay.active {
    opacity:1;
    visibility:visible;
}

/* =========================================================
   SETTINGS MODAL
========================================================= */
.modal {
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.6);
    display:flex;
    justify-content:center;
    align-items:center;
    opacity:0;
    visibility:hidden;
    transition:.3s;
    z-index:2000;
}
.modal.active {
    opacity:1;
    visibility:visible;
}

.modal-box {
    background:#fff;
    color:#000;
    padding:30px;
    width:360px;
    border-radius:12px;
}

.modal-box h2 { margin-top:0; }

.modal-box select {
    width:100%;
    padding:10px;
    margin:10px 0;
}

.modal-actions {
    display:flex;
    gap:10px;
}
.modal-actions button {
    flex:1;
    padding:10px;
    border:none;
    cursor:pointer;
}
.save { background:#ff3b3b; color:#fff; }
.cancel { background:#ddd; }

</style>
</head>

<body>

<div class="top-promo">🚀 Extra -10% off ANY Game Pass!</div>

<header class="k4g-header">
    <div class="header-left">
        <div class="logo">NAZWA</div>
        <div class="pill"><i class="fa fa-heart"></i> Buy, Play, Help!</div>
        <div class="pill"><i class="fa fa-dollar-sign"></i> Earn $ in Affiliate</div>
        <div class="pill"><i class="fa fa-gift"></i> Get Cheap AAA Game</div>
    </div>

    <div class="header-center">
        <i class="fa fa-search"></i>
        <input placeholder="Search">
    </div>

    <div class="header-right">
        <div class="lang-btn" onclick="openSettings()">🇪🇺 <span id="currencyLabel">PLN</span></div>
        <div class="cart-btn" onclick="toggleCart()">
            <i class="fa fa-shopping-cart"></i>
            <span id="cartCount">0</span>
        </div>
        <button class="btn-login" onclick="location.href='login.php'">Log in</button>
        <button class="btn-register" onclick="location.href='register.php'">Register</button>
    </div>
</header>

<nav>
    <a href="#">Bestsellers</a>
    <a href="#">Games</a>
    <a href="#">Software</a>
    <a href="#">Pre-paids</a>
    <a href="#">Steam Gift Cards</a>
    <a href="#">Game Pass</a>
</nav>

<section class="products" id="products"></section>

<!-- CART -->
<div class="cart" id="cart">
    <h3>Your cart</h3>
    <div class="cart-items" id="cartItems"></div>
    <div class="cart-total" id="cartTotal">Total: 0 PLN</div>
</div>
<div class="overlay" id="overlay" onclick="toggleCart()"></div>

<!-- SETTINGS MODAL -->
<div class="modal" id="settingsModal">
    <div class="modal-box">
        <h2>Update your settings</h2>

        <label>Language</label>
        <select id="lang">
            <option>English</option>
            <option>Polski</option>
        </select>

        <label>Currency</label>
        <select id="currency">
            <option value="PLN">PLN</option>
            <option value="EUR">EUR</option>
        </select>

        <div class="modal-actions">
            <button class="cancel" onclick="closeSettings()">Cancel</button>
            <button class="save" onclick="saveSettings()">Save</button>
        </div>
    </div>
</div>

<script>
let currency = "PLN";
let rate = { PLN:1, EUR:0.22 };

let products = [
    {t:"Call of Duty MW3",p:356,img:"https://cdn.kinguin.com/media/catalog/product/cache/926507dc7f93631a094422215b778fe0/c/a/call_of_duty_mwiii.jpeg"},
    {t:"Football Manager 26",p:150,img:"https://cdn.kinguin.com/media/catalog/product/cache/926507dc7f93631a094422215b778fe0/f/o/football_manager_26.jpeg"},
    {t:"Minecraft Java & Bedrock",p:37,img:"https://cdn.kinguin.com/media/catalog/product/cache/926507dc7f93631a094422215b778fe0/m/i/minecraft-java-bedrock.jpeg"}
];

let cart=[];

const productsEl=document.getElementById("products");

function renderProducts(){
    productsEl.innerHTML="";
    products.forEach((p,i)=>{
        productsEl.innerHTML+=`
        <div class="product">
            <div class="badge">HOT</div>
            <img src="${p.img}">
            <h4>${p.t}</h4>
            <div class="price">${(p.p*rate[currency]).toFixed(2)} ${currency}</div>
            <button class="add" onclick="add(${i})">Add to cart</button>
        </div>`;
    });
}

function add(i){
    let f=cart.find(x=>x.t===products[i].t);
    if(f)f.q++; else cart.push({...products[i],q:1});
    renderCart();
}

function renderCart(){
    let el=document.getElementById("cartItems");
    el.innerHTML="";
    let total=0;
    cart.forEach((p,i)=>{
        total+=p.p*p.q;
        el.innerHTML+=`
        <div class="cart-item">
            <img src="${p.img}">
            <div>
                ${p.t}<br>
                ${(p.p*rate[currency]*p.q).toFixed(2)} ${currency}
                <div class="qty">
                    <button onclick="chg(${i},-1)">-</button>${p.q}
                    <button onclick="chg(${i},1)">+</button>
                </div>
            </div>
        </div>`;
    });
    document.getElementById("cartTotal").innerText=
        "Total: "+(total*rate[currency]).toFixed(2)+" "+currency;
    document.getElementById("cartCount").innerText=
        cart.reduce((a,b)=>a+b.q,0);
}

function chg(i,d){
    cart[i].q+=d;
    if(cart[i].q<=0)cart.splice(i,1);
    renderCart();
}

function toggleCart(){
    document.getElementById("cart").classList.toggle("active");
    document.getElementById("overlay").classList.toggle("active");
}

function openSettings(){ document.getElementById("settingsModal").classList.add("active"); }
function closeSettings(){ document.getElementById("settingsModal").classList.remove("active"); }

function saveSettings(){
    currency=document.getElementById("currency").value;
    document.getElementById("currencyLabel").innerText=currency;
    closeSettings();
    renderProducts();
    renderCart();
}

renderProducts();
</script>

</body>
</html>
